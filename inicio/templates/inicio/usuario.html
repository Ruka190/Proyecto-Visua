{% load static %}  <!-- 1. Esta línea le avisa a Django que usaremos archivos estáticos -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Grid Bootstrap</title>

  <!-- ESTA LÍNEA ES LA QUE FALTA PARA ACTIVAR BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container text-center">
  <!-- Fila 1 -->
  <div class="row mb-3">
    <div class="col-md-4 text-dark p-3 border" style="background-color: #FBF7F2;">
      <!-- 2. Aquí llamamos a la imagen usando la etiqueta static -->
      <img src="{% static 'inicio/img/javier.jpg' %}" alt="Foto de Javier" class="img-fluid rounded border" style="max-height: 250px; object-fit: cover;">
    </div>
    <div class="col-6 col-md-8">
      <p class="fs-6 fw-bold mb-1">Hola, Javier</p>

      <!-- Texto inferior: más grande -->
      <h4 class="fw-normal mb-0">¿Qué conexión buscas hoy?</h4>
    </div>
  </div>

  <!-- Fila 2 -->
    <div class="row mb-3">
    <div class="col-6 col-md-2" style="background-color: #FBF7F2">Valores</div>
    <div class="col-6 col-md-1"></div>
    <div class="col-6 col-md-2" style="background-color: #FBF7F2">Hobie</div>
    <div class="col-6 col-md-1"></div>
    <div class="col-6 col-md-2" style="background-color: #FBF7F2">Gustos</div>
    <div class="col-6 col-md-1"></div>
    <div class="col-6 col-md-2" style="background-color: #FBF7F2">Experiencias</div>
    <div class="col-6 col-md-1"> > </div>
    </div>

  <!-- Fila 3 -->
  <div class="row mb-3">
    <div class="col-6 col-md-12 bg-secondary text-white p-3 border">.col-6 (Gris)</div>
  </div>

  <div class="row">
    <div class="col-6 col-md-1"></div>
    <div class="col-6 col-md-2 bg-warning text-dark p-3 border">.col-6 .col-md-4 (Amarillo)</div>
    <div class="col-6 col-md-2 bg-info text-dark p-3 border">.col-6 .col-md-4 (Celeste)</div>
    <div class="col-6 col-md-2 bg-danger text-white p-3 border">.col-6 .col-md-4 (Rojo)</div>
    <div class="col-6 col-md-2 bg-danger text-white p-3 border">.col-6 .col-md-4 (Rojo)</div>
    <div class="col-6 col-md-2 bg-danger text-white p-3 border">.col-6 .col-md-4 (Rojo)</div>
  </div>
</div>

</body>
</html>
