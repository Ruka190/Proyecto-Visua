{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Beyond Date{% endblock %}</title>
  <!-- Poppins 400,500,600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tokens y sistema Beyond Date -->
  <link rel="stylesheet" href="{% static 'inicio/css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'inicio/css/typography.css' %}">
  <link rel="stylesheet" href="{% static 'inicio/css/components.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include "inicio/includes/header.html" %}

  <main class="container" style="max-width: 1200px; margin-top: 16px; margin-bottom: 16px;">
    {% block content %}{% endblock %}
  </main>

  {% include "inicio/includes/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
