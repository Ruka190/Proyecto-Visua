<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dos Botones Centrados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #E7D8D2;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .button-container { display: flex; gap: 20px; }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background-color: #ff7f54; color: #ffffff; }
        .btn-primary:hover { background-color: #fc5d27; transform: translateY(-2px); }
        .btn-secondary { background-color: #ff7f54; color: #ffffff; }
        .btn-secondary:hover { background-color: #fc5d27; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="button-container">
    <!-- Botones sin función por ahora -->
    <a href="#" class="btn btn-primary">Administrador</a>
    
    <!-- AQUÍ ESTÁ EL CAMBIO: Reemplazamos el "#" por la ruta de Django -->
    <a href="{% url 'usuario' %}" class="btn btn-secondary">Usuario</a>
</div>
</body>
</html>
